name: Update LOC Badge

on:
  push:
    branches: [main]
    paths: ["src/**"]

permissions:
  contents: write

jobs:
  update-loc:
    name: Update Lines of Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Count LOC and update badge
        run: |
          LOC=$(find src -name '*.rs' | xargs wc -l | tail -1 | awk '{print $1}')

          if [ "$LOC" -ge 1000 ]; then
            LOC_DISPLAY=$(awk "BEGIN {printf \"%.1fk\", $LOC/1000}")
          else
            LOC_DISPLAY="$LOC"
          fi

          sed -i "s|Lines_of_Code-[^-]*-|Lines_of_Code-${LOC_DISPLAY}-|" README.md

          if git diff --quiet README.md; then
            echo "Badge already up to date ($LOC_DISPLAY)"
            exit 0
          fi

          echo "Updating LOC badge to $LOC_DISPLAY ($LOC lines)"

      - name: Commit and push
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update LOC badge"
          git push
