<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Ward. Declarative GitHub repository management. Plan, apply, verify.">
  <style>
    .f { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .pill text { animation: lit 6s ease-in-out infinite; }
    .pill rect { animation: litbg 6s ease-in-out infinite; }
    .p2 text, .p2 rect { animation-delay: 1.5s; }
    .p3 text, .p3 rect { animation-delay: 3s; }
    @keyframes litbg {
      0%, 40%, 100% { fill: #14B8A6; fill-opacity: 0.16; }
      10%, 25% { fill: #0D9488; fill-opacity: 1; }
    }
    @keyframes lit {
      0%, 40%, 100% { fill: #7FE3D6; }
      10%, 25% { fill: #FFFFFF; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="220" rx="24"/></clipPath>
    <clipPath id="tile"><rect x="32" y="32" width="448" height="448" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="220" rx="24" fill="#0F2A44"/>
    <g transform="translate(46 35) scale(0.3348) translate(-32 -32)">
      <rect x="35" y="35" width="442" height="442" rx="101" fill="#0F2A44" stroke="#14B8A6" stroke-width="6"/>
      <g clip-path="url(#tile)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="0 248 179;6 248 179;0 248 179;-6 248 179;0 248 179"/>
          <polygon points="248,170 248,188 480,244 480,140" fill="#14B8A6"/>
        </g>
      </g>
      <polygon points="196,218 240,218 282,480 154,480" fill="#FFFFFF"/>
      <rect x="180" y="200" width="76" height="13" rx="2" fill="#FFFFFF"/>
      <rect x="194" y="160" width="48" height="34" rx="3" fill="#FFFFFF"/>
      <polygon points="184,152 218,122 252,152" fill="#FFFFFF"/>
    </g>
    <text class="f" x="244" y="110" font-size="86" font-weight="700" fill="#FFFFFF" letter-spacing="-2">ward</text>
    <text class="f" x="247" y="149" font-size="22" font-weight="600" fill="#B6C4D4">Declarative GitHub repository management. Plan, apply, verify.</text>
    <g class="f" font-size="17" font-weight="600" text-anchor="middle">
      <g class="pill"><rect x="247" y="168" width="96" height="32" rx="16" fill="#14B8A6" fill-opacity="0.16" stroke="#14B8A6" stroke-width="1.5"/><text x="295" y="189" fill="#7FE3D6">plan</text></g>
      <text x="366" y="190" fill="#7C93AA" font-size="18">→</text>
      <g class="pill p2"><rect x="389" y="168" width="96" height="32" rx="16" fill="#14B8A6" fill-opacity="0.16" stroke="#14B8A6" stroke-width="1.5"/><text x="437" y="189" fill="#7FE3D6">apply</text></g>
      <text x="508" y="190" fill="#7C93AA" font-size="18">→</text>
      <g class="pill p3"><rect x="531" y="168" width="96" height="32" rx="16" fill="#14B8A6" fill-opacity="0.16" stroke="#14B8A6" stroke-width="1.5"/><text x="579" y="189" fill="#7FE3D6">verify</text></g>
    </g>
  </g>
</svg>
