<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="9 categories. No state file. Plan, apply, verify. 4.5 times faster plan.">
  <style>
    .f { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
    .s { font-size: 14px; font-weight: 600; fill: #9FB3C8; }
    .a { fill: #14B8A6; }
  </style>
  <g class="f">
    <rect x="0" y="0" width="270" height="120" rx="20" fill="#0F2A44"/>
    <text class="m" x="28" y="56"><tspan class="a">9</tspan> categories</text>
    <text class="s" x="28" y="84">repository to integrations</text>

    <rect x="290" y="0" width="260" height="120" rx="20" fill="#0F2A44"/>
    <text class="m" x="318" y="56">No state file</text>
    <text class="s" x="318" y="84">reads live GitHub state</text>

    <rect x="570" y="0" width="340" height="120" rx="20" fill="#0F2A44"/>
    <text class="m" x="598" y="56">Plan <tspan class="a">→</tspan> Apply <tspan class="a">→</tspan> Verify</text>
    <text class="s" x="598" y="84">one category at a time</text>

    <rect x="930" y="0" width="270" height="120" rx="20" fill="#0F2A44"/>
    <text class="m" x="958" y="56"><tspan class="a">4.5×</tspan> faster plan</text>
    <text class="s" x="958" y="84">plan on 10 repos, vs 0.4.2</text>
  </g>
</svg>
