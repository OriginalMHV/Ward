[package]
name = "ward"
version = "0.1.0"
edition = "2024"
authors = ["Michael Herland Valen"]
description = "GitHub repository management for developers — plan, apply, verify."
license = "MIT"
repository = "https://github.com/michaelvalen/ward"
keywords = ["github", "cli", "repository-management", "security", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ward"
path = "src/lib.rs"

[[bin]]
name = "ward"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "color"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP & GitHub API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
octocrab = "0.44"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Templating
tera = "1"

# Embed templates in binary
rust-embed = "8"

# Output formatting
tabled = "0.17"
console = "0.15"
indicatif = "0.17"
similar = "2"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Rate limiting
governor = "0.8"

# Regex for filtering
regex = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Base64 for Git blob API
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
insta = { version = "1", features = ["yaml"] }
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
