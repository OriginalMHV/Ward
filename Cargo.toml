[package]
name = "ward-cli"
version = "0.4.2"
edition = "2024"
authors = ["Michael Herland Valen"]
description = "GitHub repository management for developers. Plan, apply, verify."
license = "MIT"
repository = "https://github.com/OriginalMHV/Ward"
homepage = "https://github.com/OriginalMHV/Ward"
readme = "README.md"
keywords = ["github", "cli", "repo-management", "security", "devtools"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[lib]
name = "ward"
path = "src/lib.rs"

[[bin]]
name = "ward"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env", "color"] }
clap_complete = { version = "4" }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP & GitHub API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Templating
tera = "1"

# Embed templates in binary
rust-embed = "8"

# Output formatting
tabled = { version = "0.20", default-features = false, features = ["ansi"] }
console = "0.16"
indicatif = "0.18"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"

# Regex for filtering
regex = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Glob pattern matching for repo overrides
glob-match = "0.2"

# Base64 for Git blob API
base64 = "0.22"
toml_edit = "0.25.10"

# LibSodium-compatible sealed-box encryption for GitHub Actions/environment secrets
crypto_box = { version = "0.9", features = ["seal"] }

# Percent-encoding for environment names in Actions/environments API paths
percent-encoding = "2.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
insta = { version = "1", features = ["yaml"] }
tokio-test = "0.4"
serde_yaml = "0.9.34"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
